# =========================================================
# ACME — COMMON THEME (token overrides)
# =========================================================
# The entire brand, in one file. Every type of this theme — login today, email
# and account when they are added — imports this one palette, so a colour is
# changed here once rather than once per type.
#
# `parent=modern.base` resolves to modern.base/common, so the ~80 tokens defined
# there arrive here and only the differences below are restated.
# =========================================================

parent=modern.base


# Brand colour and its two interaction states.
kcTokenColorPrimary=#0d9488
kcTokenColorPrimaryHover=#0f766e
kcTokenColorPrimaryActive=#115e59
kcTokenColorLink=#0d9488
kcTokenColorLinkHover=#0f766e

# The page backdrop, tinted to match.
kcTokenPageBackground=radial-gradient(circle at 15% 0%, #ecfdf5 0%, #f8fafc 45%, #f1f5f9 100%)

# A squarer, more corporate shape than the parent's rounded default.
kcTokenRadiusSm=3px
kcTokenRadiusMd=5px
kcTokenRadiusLg=8px

# Dark palette. Override these alongside the light ones — a brand colour picked
# for a white card is usually too dark on a near-black one.
kcTokenDarkColorPrimary=#2dd4bf
kcTokenDarkColorPrimaryHover=#5eead4
kcTokenDarkColorPrimaryActive=#99f6e4
kcTokenDarkColorOnPrimary=#042f2e
kcTokenDarkColorLink=#5eead4
kcTokenDarkColorLinkHover=#99f6e4
kcTokenDarkPageBackground=radial-gradient(circle at 15% 0%, #042f2e 0%, #0f172a 45%, #020617 100%)
