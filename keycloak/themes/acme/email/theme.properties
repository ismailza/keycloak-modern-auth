# =========================================================
# ACME — EMAIL THEME (example child theme)
# =========================================================
# A complete rebrand of every mail Keycloak sends: no template, no message, no
# geometry. Three lines, and the colours arrive from the same file that
# rebrands the login pages.
#
# Try it: Admin console -> your realm -> Realm settings -> Themes -> Email theme
# -> `acme`. In dev mode the change is live on the next mail sent.

parent=modern.base

# ../common/theme.properties — the *same* file acme/login imports. The teal in
# the login button is the teal in the mail button, because there is one
# definition of it. Importing it replaces the parent's import rather than
# adding to it; only one is honoured per theme.
import=common/acme

# ---------------------------------------------------------
# BRAND
# ---------------------------------------------------------
# Unlike the login theme, the logo cannot be inherited from a file: mail is
# rendered outside any HTTP request, so login/resources/img/logo.svg has no URL
# a mail client could fetch. It has to be an absolute, publicly reachable
# address, and an SVG will not do — Gmail and Outlook render PNG or JPEG only:
#
#   kcEmailLogoUrl=https://acme.example.com/assets/email-logo.png
#   kcEmailLogoAlt=Acme
#
# Left unset here because this repository has nowhere to host it, so the mails
# show "Acme" (the realm's display name) as a text wordmark instead. That is
# also what recipients see whenever remote images are blocked, which is the
# default in most clients — worth looking at before shipping a logo.
