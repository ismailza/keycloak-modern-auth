# ==============================================================================
# ACME — ENGLISH MESSAGES (email)
# ==============================================================================
# Every subject and body comes from `base`, and the shell's two strings come
# from modern.base; this file exists for one key.
#
# The description does not inherit: its key names the theme it belongs to, so a
# child theme without its own copy shows no description at all in the admin
# console. When you copy this theme as the start of a new brand, rename the key
# to match the new directory name.
# ==============================================================================

# Shown beside the theme in the admin console (Realm settings -> Themes).
theme.acme.email.description=Example child theme: the same teal as the acme login pages, from the same palette file. Rebrands every mail with token overrides alone — no template, no CSS.
