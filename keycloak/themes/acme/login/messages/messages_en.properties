# ==============================================================================
# ACME — ENGLISH MESSAGES
# ==============================================================================
# Every message comes from modern.base and `base`; this file exists for one key.
#
# The description does not inherit: its key names the theme it belongs to, so a
# child theme without its own copy shows no description at all in the admin
# console. When you copy this theme as the start of a new brand, rename the key
# to match the new directory name — leaving `theme.acme.…` behind is the usual
# reason a freshly copied theme has a blank description.
# ==============================================================================

# Shown beside the theme in the admin console (Realm settings -> Themes).
theme.acme.login.description=Example child theme: teal, squarer corners, same layout. Rebrands modern.base with token overrides alone — no CSS, no templates.
