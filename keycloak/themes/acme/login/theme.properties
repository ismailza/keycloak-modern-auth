# =========================================================
# ACME — LOGIN THEME (example child theme)
# =========================================================
# A complete rebrand of the login pages: no template, no stylesheet, no class
# name. Only token values and a logo file.
#
# This is the whole point of `modern.base` — copy this folder, rename it, change
# the colours, and you have a themed realm. Everything else keeps flowing from
# the parent, including future fixes to it.
#
# Try it: Admin console -> your realm -> Realm settings -> Themes -> Login theme
# -> `acme`. In dev mode the change is live on the next page load.

parent=modern.base

# Keep the parent's stylesheet and append your own only when a token cannot
# express what you need (a custom layout, an @font-face declaration):
#   styles=css/login.css css/acme.css
# Note that the parent's file has to be listed again — `styles` is replaced,
# not merged.

# ---------------------------------------------------------
# BRAND
# ---------------------------------------------------------
# login/resources/img/logo.svg is picked up automatically because theme
# resources resolve child-first; kcLogoUrl only needs restating to point at a
# different filename. kcLogoAlt fills the <img alt> — set it to the company
# name, since the logo is the page's only branding.
kcLogoAlt=Acme

# The tokens themselves live in ../common/theme.properties, so the email and
# account types of this theme read the very same palette. Importing it replaces
# the parent's import rather than adding to it — only one is honoured.
import=common/acme
