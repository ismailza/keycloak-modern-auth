<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 36" role="img" aria-label="Acme">
  <title>Acme</title>
  <!--
    Overrides modern.base's logo purely by existing at the same path — theme
    resources resolve child-first, so there is no property to change.

    Note how the mark echoes the child theme's tokens: teal instead of indigo,
    and a 6px corner radius against the parent's 10px, matching the squarer
    kcTokenRadius* values in theme.properties. Keeping a logo consistent with
    the token palette is manual work — the two live in different documents.
  -->
  <style>
    .badge-from { stop-color: #14b8a6; }
    .badge-to   { stop-color: #0f766e; }
    .word       { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .badge-from { stop-color: #5eead4; }
      .badge-to   { stop-color: #14b8a6; }
      .word       { fill: #e2e8f0; }
    }
  </style>

  <defs>
    <linearGradient id="acme-badge" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop class="badge-from" offset="0"/>
      <stop class="badge-to" offset="1"/>
    </linearGradient>
    <!-- The "A" is cut out of the badge: white keeps, black removes. -->
    <mask id="acme-a">
      <rect width="36" height="36" rx="6" fill="#ffffff"/>
      <path d="M10 26.4 18 9.6l8 16.8" fill="none" stroke="#000000" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.6 21.2h8.8" fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="36" height="36" rx="6" fill="url(#acme-badge)" mask="url(#acme-a)"/>

  <!-- lengthAdjust="spacing" tracks the four letters out to a fixed width,
       which reads as a logotype and is immune to font fallback. -->
  <text class="word" x="48" y="23" textLength="58" lengthAdjust="spacing">ACME</text>
</svg>
