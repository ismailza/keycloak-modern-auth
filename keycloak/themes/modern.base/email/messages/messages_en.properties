# ==============================================================================
# MODERN.BASE — ENGLISH MESSAGES (email)
# ==============================================================================
# This bundle overlays the one from `base`. Every key it does not restate keeps
# Keycloak's own wording, in all 36 languages `base` ships — which is the point
# of overriding only html/template.ftl: the subjects and bodies of every mail
# stay translated.
#
# The two keys below are new, and belong to the shell rather than to any one
# mail. New keys are the one thing to be careful with here: an English-only key
# is not a hole, because Keycloak walks the locale chain (fr -> en -> the key
# name itself) and merges what it finds, so an untranslated key still resolves
# to its English text for every recipient. It just arrives in the wrong
# language. Add a messages_<locale>.properties alongside this one for each
# language your realm actually offers.
#
# Bundles are read as UTF-8, so accented characters and typographic dashes are
# safe verbatim; no \uXXXX escaping is needed.
#
# One .properties trap specific to email bundles: these strings are run through
# java.text.MessageFormat, where an apostrophe is a quoting character. A literal
# one has to be doubled — Keycloak's own bundle writes "don''t" for that reason.
# ==============================================================================

# Shown beside the theme in the admin console (Realm settings -> Themes -> Email
# theme), and returned by /admin/serverinfo. The key format is
# `theme.<theme-name>.<type>.description`; it is resolved in English whatever
# locale the admin is browsing in, and it does NOT inherit — a child theme needs
# its own copy under its own name.
theme.modern.base.email.description=Branded HTML mail on a card, sharing the login theme's palette, with a dark palette and a plain-text alternative. Neutral by design — the parent to build your own brand on.

# Introduces the raw action URL printed under the body. Rendered only on the
# mails that carry a link, and only while kcEmailLinkFallback is true.
# Deliberately does not say "if the button does not work": in a client that
# dropped the stylesheet there is no button, just a link, and the sentence has
# to make sense there too.
modernEmailLinkFallback=Trouble opening the link above? Copy this address into your browser:

# The footer line under the card. {0} is the realm display name.
modernEmailFooter=This message was sent automatically by {0}. Please do not reply to it.
