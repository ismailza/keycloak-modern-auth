# =========================================================
# MODERN.BASE — EMAIL THEME
# =========================================================
# The same idea as the login theme, under much harsher constraints: one shell
# template, no stylesheet file, and every value read from the shared palette in
# ../common/theme.properties. A child theme rebrands every mail Keycloak sends
# by overriding tokens — see keycloak/themes/acme/email/.
#
# Full walkthrough: docs/email-theme.md
#
# ---------------------------------------------------------
# WHY AN EMAIL THEME CANNOT WORK LIKE A LOGIN THEME
# ---------------------------------------------------------
# The login theme publishes its tokens as CSS custom properties and lets
# login.css read them. Neither half of that is available here:
#
#   - Mail clients drop external stylesheets. There is no <link>, so there is no
#     login.css equivalent — html/template.ftl interpolates token values
#     straight into `style` attributes instead.
#   - Gmail strips any declaration containing var(), so custom properties are
#     out. Tokens are resolved at render time, in FreeMarker, not at paint time.
#   - Outlook on Windows renders through Word, which ignores rem, flexbox and
#     grid. Anything sized here is sized in px, and the layout is tables.
#
# So the colour tokens are shared with the login theme verbatim (they are hex
# values — portable), while geometry gets its own px-based set below.
# ---------------------------------------------------------

# ---------------------------------------------------------
# INHERITANCE
# ---------------------------------------------------------
# `base` ships html/ and text/ templates for all ~17 mails (verification,
# password reset, execute-actions, organization invite, the event
# notifications, ...). Each html/<type>.ftl does nothing but import
# "template.ftl" and interpolate one localized message into it:
#
#   <#import "template.ftl" as layout>
#   <@layout.emailLayout>
#   ${kcSanitize(msg("passwordResetBodyHtml", link, ...))?no_esc}
#   </@layout.emailLayout>
#
# Templates resolve child-first by name, so overriding html/template.ftl alone
# restyles every one of them, and the message bodies keep coming from base in
# all 36 languages it ships. That is the whole trick of this theme.
#
# `keycloak` is the other built-in email parent; it adds nothing but a
# description message, so `base` is the shorter path.
parent=base

# Pulls in ../common/theme.properties — the palette the login theme also reads.
# One brand colour, changed once, moves the login button and the mail button
# together. An import merges the imported theme's properties into ours; exactly
# one is honoured, and locally-set properties win over imported ones.
import=common/modern.base

# The language a mail is rendered in comes from the user's locale, not from this
# list, and the bodies themselves are inherited from `base` — which ships all of
# these. Restated to mirror the login theme, so a realm that narrows its offered
# languages narrows both types the same way.
locales=en,fr,de,es,it,nl,pt-BR,ar

# =========================================================
# BRANDING SLOTS
# =========================================================
# Paths, not CSS values, so these sit outside the token system — same as
# kcLogoUrl in the login theme.

# A LOGO IN AN EMAIL MUST BE AN ABSOLUTE, PUBLICLY REACHABLE https:// URL.
# Unlike the login theme there is no ${url.resourcesPath} to hang it off: mail
# is rendered outside any HTTP request, and email/resources/ is not published.
# The other two ways of embedding an image are both dead ends here — Keycloak
# attaches no CID parts to these mails, and Gmail, Outlook and Apple Mail all
# refuse data: URIs in <img src>.
#
# Left empty on purpose: an empty value renders the realm's display name as a
# text wordmark, which always arrives. A broken image icon at the top of a
# password-reset mail costs more trust than a missing logo.
kcEmailLogoUrl=
# Alt text for that logo. Falls back to the realm display name. Worth setting:
# most clients block remote images by default, so for many recipients the alt
# text *is* the logo.
kcEmailLogoAlt=
# Rendered height in px, as a bare number — it feeds both the `height`
# attribute (which Outlook needs) and the inline style. Width follows the
# aspect ratio.
kcEmailLogoHeight=32

# Appends a "copy this address into your browser" block under the body, showing
# the raw action URL, on the mails that carry a link. Costs a few lines of small
# print and saves the support ticket from the client that mangles the button.
# Set to false to drop it.
kcEmailLinkFallback=true

# =========================================================
# EMAIL GEOMETRY TOKENS
# =========================================================
# Everything below is px or unitless, for the Word-engine reason above. The
# colour, radius, border-width and font-family tokens are NOT restated here —
# they come from ../common/theme.properties, already in portable units, and are
# read directly by html/template.ftl.
#
# Three tokens from the shared palette are deliberately *not* used by the mail
# shell, because their values are CSS the mail clients cannot parse:
#   kcTokenPageBackground     a radial-gradient  -> kcTokenColorBackground instead
#   kcTokenCardAccent         uses var()         -> kcTokenColorPrimary instead
#   kcTokenFontFamilyHeading  uses var()         -> kcTokenFontFamily instead

# ---- Layout ----------------------------------------------
# 600px is the traditional mail width: it is what the Outlook reading pane fits
# without horizontal scrolling. The card is fluid below that.
kcTokenEmailWidth=600px
# Breathing room between the card and the edge of the client's viewport.
kcTokenEmailPagePadding=24px
kcTokenEmailCardPadding=32px
# Space between paragraphs of the body copy.
kcTokenEmailGap=16px

# ---- Typography ------------------------------------------
# 16px is the floor for body copy in mail: iOS auto-enlarges anything smaller,
# which breaks a fixed layout.
kcTokenEmailFontSize=16px
kcTokenEmailFontSizeSm=14px
kcTokenEmailFontSizeXs=12px
# Monospace stack for the one-time code block. `ui-monospace` first for modern
# clients, the rest for the ones that still resolve fonts like it is 2010.
kcTokenEmailFontFamilyCode=ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace
kcTokenEmailCodeFontSize=28px
kcTokenEmailCodeLetterSpacing=6px

# ---- Button ----------------------------------------------
# Padding as a CSS shorthand: vertical then horizontal.
kcTokenEmailButtonPadding=13px 24px
