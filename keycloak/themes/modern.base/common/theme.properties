# =========================================================
# MODERN.BASE — COMMON THEME (shared design tokens)
# =========================================================
# A `common` theme is the only channel through which the login, email, account
# and admin types of a theme can share configuration. Each type has its own
# theme.properties and cannot see the others', and `parent=` cannot bridge them
# because a parent must provide the same type. `import=` can:
#
#   modern.base/login/theme.properties     import=common/modern.base
#   modern.base/email/theme.properties     import=common/modern.base
#
# An import does two things — it merges the imported theme's properties into the
# importing one, and it makes the imported theme's resources/ reachable under
# the importing theme's own resource path. So this file is where the palette
# lives, and common/resources/ is where artwork shared between types belongs.
#
# Exactly one import is honoured per type. Space- and comma-separated lists are
# ignored silently, which is why the login theme trades `common/keycloak` away
# for this one — see the note there.
#
# Precedence runs the safe way round: a property set in the importing theme wins
# over the imported one. So a token belongs here when every type should share it,
# and stays in login/theme.properties when only the login pages should differ.
#
# Full walkthrough: docs/login-theme.md
# =========================================================

# `keycloak` is the only built-in theme providing a `common` type. Nothing is
# inherited from it in practice — it ships resources only, no theme.properties —
# but the type still needs a valid parent.
parent=keycloak

# The properties below are consumed by the LOGIN theme's template.ftl, which
# emits them as CSS custom properties. Other types read the same values through
# their own mechanism — an email template interpolates them straight into inline
# style attributes, because mail clients have no `var()` support.

# Every `kcToken*` property below is emitted by template.ftl as a CSS custom
# property on :root, converting camelCase to kebab-case:
#
#   kcTokenColorPrimary  ->  --kc-color-primary
#   kcTokenFontSizeSm    ->  --kc-font-size-sm
#
# The loop is generic: adding a brand-new `kcTokenFoo=...` line in a child theme
# publishes `--kc-foo` without touching the template. login.css only ever reads
# these variables, so overriding a value here restyles every login page at once.
#
# Values are raw CSS, so anything the property accepts works — a hex colour, a
# `color-mix()` call, a gradient, a font stack, `clamp()`.

# ---- Colour scheme ---------------------------------------
# Drives the native `color-scheme` property: it themes scrollbars, focus rings
# and form controls the browser draws itself. `light dark` follows the OS; pin
# it to `light` or `dark` to opt out of the dark palette further down.
kcTokenColorScheme=light dark

# ---- Surfaces & text -------------------------------------
# The page behind the card. Any background shorthand value: a flat colour, a
# gradient, or url(...) for a photo background.
kcTokenPageBackground=radial-gradient(circle at 15% 0%, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%)
kcTokenColorBackground=#f8fafc
kcTokenColorSurface=#ffffff
# Slightly recessed surface: social-provider buttons, the "try another way" row.
kcTokenColorSurfaceMuted=#f8fafc
kcTokenColorSurfaceHover=#f1f5f9
kcTokenColorBorder=#e2e8f0
kcTokenColorBorderStrong=#cbd5e1
kcTokenColorText=#0f172a
kcTokenColorTextMuted=#64748b
kcTokenColorLink=#4f46e5
kcTokenColorLinkHover=#4338ca

# ---- Brand -----------------------------------------------
# The one token most child themes will override. Everything primary-coloured —
# submit button, focus ring, links, the card's top accent — derives from it.
kcTokenColorPrimary=#4f46e5
kcTokenColorPrimaryHover=#4338ca
kcTokenColorPrimaryActive=#3730a3
# Text/icon colour ON the primary surface. Override it together with the
# primary colour: a light brand colour needs dark text to stay readable.
kcTokenColorOnPrimary=#ffffff
# Focus ring. `color-mix` keeps it in sync with the brand automatically.
kcTokenColorFocusRing=color-mix(in srgb, var(--kc-color-primary) 35%, transparent)

# ---- Status ----------------------------------------------
# Each status has a foreground (text, icon, left border) and a tinted surface
# used as the alert background.
kcTokenColorDanger=#b91c1c
kcTokenColorDangerSurface=#fef2f2
kcTokenColorSuccess=#15803d
kcTokenColorSuccessSurface=#f0fdf4
kcTokenColorWarning=#b45309
kcTokenColorWarningSurface=#fffbeb
kcTokenColorInfo=#0369a1
kcTokenColorInfoSurface=#f0f9ff

# ---- Typography ------------------------------------------
# No webfont is loaded on purpose: a login page is on the critical path of every
# authentication, and a font request adds a render-blocking round trip. To use
# one, add an @font-face stylesheet via `styles=` in the child theme and point
# kcTokenFontFamily at it.
kcTokenFontFamily=system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
kcTokenFontFamilyHeading=var(--kc-font-family)
kcTokenFontSizeXs=0.75rem
kcTokenFontSizeSm=0.875rem
kcTokenFontSizeBase=1rem
kcTokenFontSizeLg=1.125rem
# Fluid page title: grows with the viewport, clamped at both ends.
kcTokenFontSizeTitle=clamp(1.375rem, 1.2rem + 0.8vw, 1.75rem)
kcTokenFontWeightNormal=400
kcTokenFontWeightMedium=500
kcTokenFontWeightBold=650
kcTokenLineHeight=1.5
kcTokenLetterSpacingTitle=-0.02em

# ---- Shape -----------------------------------------------
# Set every radius to 0 for a square, enterprise look, or raise kcTokenRadiusLg
# alone to round only the card.
kcTokenRadiusSm=6px
kcTokenRadiusMd=10px
kcTokenRadiusLg=16px
kcTokenRadiusFull=999px
kcTokenBorderWidth=1px
# Accent strip across the top of the card. Set to 0 to remove it.
kcTokenCardAccentHeight=3px
kcTokenCardAccent=linear-gradient(90deg, var(--kc-color-primary), color-mix(in srgb, var(--kc-color-primary) 45%, #ffffff))

# ---- Elevation -------------------------------------------
kcTokenShadowSm=0 1px 2px rgba(15, 23, 42, 0.06)
kcTokenShadowMd=0 4px 12px rgba(15, 23, 42, 0.08)
kcTokenShadowLg=0 20px 45px -20px rgba(15, 23, 42, 0.28), 0 2px 8px rgba(15, 23, 42, 0.04)

# ---- Spacing ---------------------------------------------
# One scale for the whole theme. Scaling it up is the fastest way to make the
# form feel airier without touching a single rule.
kcTokenSpaceXs=0.25rem
kcTokenSpaceSm=0.5rem
kcTokenSpaceMd=1rem
kcTokenSpaceLg=1.5rem
kcTokenSpaceXl=2rem

# ---- Layout ----------------------------------------------
kcTokenCardWidth=27rem
kcTokenCardPadding=clamp(1.5rem, 1rem + 2vw, 2.25rem)
# Height of inputs and buttons. 2.75rem = 44px, the minimum comfortable touch
# target; going below that hurts mobile usability.
kcTokenControlHeight=2.75rem
# Horizontal padding inside inputs. Deliberately its own token rather than a
# step from the spacing scale: it is tuned against the control height, not
# against the page rhythm.
kcTokenControlPaddingInline=0.75rem
kcTokenLogoHeight=2.25rem
kcTokenTransition=150ms ease

# ---- Dark palette ----------------------------------------
# `kcTokenDark*` properties are emitted inside
# @media (prefers-color-scheme: dark), under the same variable name as their
# light counterpart: kcTokenDarkColorSurface also feeds --kc-color-surface.
# Only what actually changes is listed — spacing, radii and typography are
# shared. A child theme overriding kcTokenColorPrimary should override
# kcTokenDarkColorPrimary too, usually with a lighter tint.
kcTokenDarkPageBackground=radial-gradient(circle at 15% 0%, #1e1b4b 0%, #0f172a 45%, #020617 100%)
kcTokenDarkColorBackground=#0f172a
kcTokenDarkColorSurface=#111827
kcTokenDarkColorSurfaceMuted=#1e293b
kcTokenDarkColorSurfaceHover=#273548
kcTokenDarkColorBorder=#293548
kcTokenDarkColorBorderStrong=#3b4a61
kcTokenDarkColorText=#e2e8f0
kcTokenDarkColorTextMuted=#94a3b8
kcTokenDarkColorLink=#a5b4fc
kcTokenDarkColorLinkHover=#c7d2fe
kcTokenDarkColorPrimary=#6366f1
kcTokenDarkColorPrimaryHover=#818cf8
kcTokenDarkColorPrimaryActive=#a5b4fc
kcTokenDarkColorOnPrimary=#0b1020
kcTokenDarkColorDanger=#fca5a5
kcTokenDarkColorDangerSurface=#3f1d1d
kcTokenDarkColorSuccess=#86efac
kcTokenDarkColorSuccessSurface=#14311f
kcTokenDarkColorWarning=#fcd34d
kcTokenDarkColorWarningSurface=#3a2a0c
kcTokenDarkColorInfo=#7dd3fc
kcTokenDarkColorInfoSurface=#0c2c3f
kcTokenDarkShadowLg=0 20px 45px -20px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.4)

