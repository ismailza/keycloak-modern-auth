# ==============================================================================
# MODERN.BASE — ENGLISH MESSAGES
# ==============================================================================
# This bundle overlays the one from `base`: any key not restated here keeps
# Keycloak's own wording, so this is also where you would reword a label such as
# loginAccountTitle without touching a template.
#
# Child themes overlay this file in turn — with one exception, the description
# below, whose key is scoped to a theme name and therefore never inherits.
#
# Bundles are read as UTF-8, so accented characters and typographic dashes are
# safe verbatim; no \uXXXX escaping is needed.
# ==============================================================================

# Shown beside the theme in the admin console (Realm settings -> Themes), and
# returned by /admin/serverinfo. The key format is
# `theme.<theme-name>.<type>.description` — the same convention Keycloak's own
# themes follow.
#
# Two constraints on this line:
#   - it is resolved in English only, whatever locale the admin is browsing in,
#     so a messages_fr.properties will not translate it;
#   - it describes the theme to whoever is *choosing* it for a realm. Keep it to
#     what the pages look like and what they can do — the token architecture
#     belongs in docs/login-theme.md, not here.
theme.modern.base.login.description=Clean, rounded sign-in card with automatic light/dark switching. Deliberately neutral — the parent to build your own brand on.
