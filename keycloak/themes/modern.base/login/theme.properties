# =========================================================
# MODERN-BASE — LOGIN THEME
# =========================================================
# A styling foundation, not a finished brand. It ships the templates, the CSS
# and a full set of design tokens; child themes inherit all of that and change
# nothing but token values.
#
#   keycloak/themes/acme/login/theme.properties
#     parent=modern.base
#     kcTokenColorPrimary=#e11d48
#
# That is the whole contract: no CSS is copied, no template is forked.
#
# Full walkthrough: docs/login-theme.md
#
# Reminder on `.properties` syntax: `#` only starts a comment at the beginning
# of a line, so `#4f46e5` is a perfectly valid value. Values are raw text —
# never quote them, the quotes become part of the value.

# ---------------------------------------------------------
# INHERITANCE
# ---------------------------------------------------------
# `base` ships the FreeMarker templates for every login page (login, register,
# OTP, reset password, consent, ...) with zero styling: every class name in the
# markup comes from a `kc*Class` property below. That is why this theme can
# restyle ~40 pages while overriding a single template.
#
# We deliberately do NOT inherit from `keycloak` or `keycloak.v2`: they pull in
# PatternFly, whose own CSS variables would fight ours for control.
parent=base

# Pulls in ../common/theme.properties — the design tokens, which live there so
# that the email and account types can read the same palette. An import merges
# the imported theme's properties into ours AND mounts its resources/ under our
# own resource path.
#
# Exactly one import is honoured; space- and comma-separated lists are ignored
# silently. So this replaces the `import=common/keycloak` that Keycloak's own
# login themes carry, which costs nothing here: `keycloak/common` ships no
# theme.properties at all, and ${url.resourcesCommonPath} resolves to it whether
# or not it is imported, so the passkey JS keeps loading either way.
import=common/modern.base

# Stylesheets, relative to login/resources/. Loaded in order; a child theme that
# sets `styles=css/login.css css/acme.css` keeps ours and appends its own.
styles=css/login.css

# Rendered as <meta name="..." content="..."> by template.ftl. `==` separates
# name from content, spaces separate entries.
meta=viewport==width=device-width,initial-scale=1

# Locales the login pages are offered in. Inherited from `base`, restated here
# because a child theme narrowing this list is a common ask.
locales=en,fr,de,es,it,nl,pt-BR,ar

# ---------------------------------------------------------
# BRANDING SLOTS
# ---------------------------------------------------------
# Paths are resolved against login/resources/ of the *most derived* theme that
# provides the file, so a child only has to drop its own img/logo.svg in place.
# Leave kcLogoUrl empty to fall back to the realm display name as a text logo.
kcLogoUrl=img/logo.svg
kcLogoAlt=
kcFaviconUrl=img/favicon.svg

# =========================================================
# CLASS NAMES
# =========================================================
# `base` templates render class="${properties.kcInputClass!}" and friends. These
# map every hook to our own semantic, framework-free class names, which is what
# lets login.css be plain CSS instead of a PatternFly override sheet.
#
# Change these only to plug in a CSS framework (set kcInputClass=form-control
# for Bootstrap, and so on). For visual tweaks, use the tokens above.

# ---- Page skeleton ---------------------------------------
kcHtmlClass=kc-html
kcBodyClass=kc-body
kcLoginClass=kc-page
kcHeaderClass=kc-page__header
kcHeaderWrapperClass=kc-page__brand
kcFormCardClass=kc-card
kcFormHeaderClass=kc-card__header
kcContentWrapperClass=kc-card__content
kcMarginTopClass=kc-mt

# ---- Form ------------------------------------------------
kcFormClass=kc-form
kcFormGroupClass=kc-form__group
kcFormGroupErrorClass=kc-form__group--error
kcFormSettingClass=kc-form__settings
kcFormOptionsClass=kc-form__options
kcFormOptionsWrapperClass=kc-form__options-secondary
kcFormButtonsClass=kc-form__buttons
kcFormButtonsWrapperClass=kc-form__buttons-wrapper
kcFormGroupHeader=kc-form__group-header

# ---- Labels & inputs -------------------------------------
kcLabelClass=kc-label
kcLabelWrapperClass=kc-label-wrapper
kcInputClass=kc-input
kcTextareaClass=kc-input kc-input--textarea
kcInputWrapperClass=kc-input-wrapper
kcInputGroup=kc-input-group
kcInputLargeClass=kc-input--lg
kcInputErrorMessageClass=kc-input__error
kcInputHelperTextBeforeClass=kc-input__helper kc-input__helper--before
kcInputHelperTextAfterClass=kc-input__helper kc-input__helper--after
kcInputClassRadio=kc-choice
kcInputClassRadioInput=kc-choice__input
kcInputClassRadioLabel=kc-choice__label
kcInputClassCheckbox=kc-choice
kcInputClassCheckboxInput=kc-choice__input
kcInputClassCheckboxLabel=kc-choice__label
kcInputClassRadioCheckboxLabelDisabled=kc-choice__label--disabled
kcCheckClass=kc-choice
kcCheckInputClass=kc-choice__input
kcCheckLabelClass=kc-choice__label
kcCheckboxClass=kc-choice
kcCheckboxInputClass=kc-choice__input
kcCheckboxLabelClass=kc-choice__label

# ---- Buttons ---------------------------------------------
# base templates compose these: class="${kcButtonClass} ${kcButtonPrimaryClass}
# ${kcButtonBlockClass}", so kcButtonClass carries the shared shape and the
# others are modifiers.
kcButtonClass=kc-btn
kcButtonPrimaryClass=kc-btn--primary
kcButtonSecondaryClass=kc-btn--secondary
kcButtonDefaultClass=kc-btn--default
kcButtonLinkClass=kc-btn--link
kcButtonBlockClass=kc-btn--block
kcButtonLargeClass=kc-btn--lg

# ---- Alerts ----------------------------------------------
kcAlertClass=kc-alert
kcAlertIconClass=kc-alert__icon
kcAlertTitleClass=kc-alert__title

# ---- Icons -----------------------------------------------
# No icon font is loaded — these classes are drawn in login.css with CSS
# `mask-image` and inline SVG, so they inherit `currentColor` and cost no extra
# request. passwordVisibility.js swaps the show/hide values wholesale, which is
# why each one is a complete class list.
kcFeedbackErrorIcon=kc-icon kc-icon--error
kcFeedbackWarningIcon=kc-icon kc-icon--warning
kcFeedbackSuccessIcon=kc-icon kc-icon--success
kcFeedbackInfoIcon=kc-icon kc-icon--info
kcResetFlowIcon=kc-icon kc-icon--restart
kcFormPasswordVisibilityButtonClass=kc-password-toggle
kcFormPasswordVisibilityIconShow=kc-icon kc-icon--eye
kcFormPasswordVisibilityIconHide=kc-icon kc-icon--eye-off
kcWebAuthnKeyIcon=kc-icon kc-icon--key
kcWebAuthnDefaultIcon=kc-icon kc-icon--key
kcWebAuthnUnknownIcon=kc-icon kc-icon--key
kcAuthenticatorDefaultClass=kc-icon kc-icon--key
kcAuthenticatorPasswordClass=kc-icon kc-icon--lock
kcAuthenticatorOTPClass=kc-icon kc-icon--mobile
kcAuthenticatorWebAuthnClass=kc-icon kc-icon--key
kcAuthenticatorWebAuthnPasswordlessClass=kc-icon kc-icon--key
kcAuthenticatorRecoveryAuthnCodesClass=kc-icon kc-icon--list

# ---- Locale switcher -------------------------------------
# Driven by base's menu-button-links.js, which toggles aria-expanded on the
# button — the CSS shows the list from that attribute, no extra script.
kcLocaleMainClass=kc-locale
kcLocaleWrapperClass=kc-locale__wrapper
kcLocaleDropDownClass=kc-locale__dropdown
kcLocaleListClass=kc-locale__list
kcLocaleListItemClass=kc-locale__item
kcLocaleItemClass=kc-locale__link

# ---- Identity providers ----------------------------------
kcFormSocialAccountSectionClass=kc-social
kcFormSocialAccountListClass=kc-social__list
kcFormSocialAccountListGridClass=kc-social__list--grid
kcFormSocialAccountGridItem=kc-social__item--grid
kcFormSocialAccountListButtonClass=kc-btn kc-btn--secondary kc-btn--block kc-social__button
kcFormSocialAccountListButtonDisabledClass=kc-btn--disabled
kcFormSocialAccountNameClass=kc-social__name
kcFormSocialAccountLinkClass=kc-social__link
kcCommonLogoIdP=kc-social__logo
# Per-provider logo classes are intentionally left unset: with no icon font
# installed, base renders the provider's display name alone, which stays legible
# for any provider. Set e.g. kcLogoIdP-google=<your class> in a child theme to
# add icons.

# ---- Registration / info footer --------------------------
kcSignUpClass=kc-signup
kcInfoAreaWrapperClass=kc-signup__wrapper

# ---- Authenticator selection -----------------------------
kcSelectAuthListClass=kc-authn-list
kcSelectAuthListItemWrapperClass=kc-authn-list__row
kcSelectAuthListItemClass=kc-authn-list__item
kcSelectAuthListItemIconClass=kc-authn-list__icon
kcSelectAuthListItemIconPropertyClass=kc-authn-list__icon-glyph
kcSelectAuthListItemBodyClass=kc-authn-list__body
kcSelectAuthListItemHeadingClass=kc-authn-list__heading
kcSelectAuthListItemDescriptionClass=kc-authn-list__desc
kcSelectAuthListItemFillClass=kc-authn-list__fill
kcSelectAuthListItemArrowClass=kc-authn-list__arrow
kcSelectAuthListItemArrowIconClass=kc-icon kc-icon--chevron
kcSelectAuthListItemTitle=kc-authn-list__title

# ---- OTP credential picker -------------------------------
kcLoginOTPListClass=kc-otp-list
kcLoginOTPListInputClass=kc-otp-list__input
kcLoginOTPListItemHeaderClass=kc-otp-list__header
kcLoginOTPListItemIconBodyClass=kc-otp-list__icon
kcLoginOTPListItemIconClass=kc-icon kc-icon--mobile
kcLoginOTPListItemTitleClass=kc-otp-list__title
kcLoginOTPListSelectedClass=kc-otp-list--selected

# ---- Recovery codes --------------------------------------
kcRecoveryCodesWarning=kc-alert kc-alert--warning kc-recovery__warning
kcRecoveryCodesList=kc-recovery__list
kcRecoveryCodesActions=kc-recovery__actions
kcRecoveryCodesConfirmation=kc-recovery__confirm

# ---- Misc ------------------------------------------------
kcSrOnlyClass=kc-sr-only
kcContainerClass=kc-container
kcContentClass=kc-content
kcFormAreaClass=kc-form-area
kcFeedbackAreaClass=kc-feedback-area
kcInfoAreaClass=kc-info-area
kcLocaleClass=kc-locale-area
