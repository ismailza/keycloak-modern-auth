<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 36" role="img" aria-label="Modern Auth">
  <title>Modern Auth</title>
  <!--
    Placeholder wordmark for the base theme. A child theme replaces it by
    dropping its own login/resources/img/logo.svg in place: theme resources
    resolve child-first, so no property has to change.

    Three things are deliberate here:

    1. The colours are hardcoded rather than reading the brand token. A logo
       loaded through <img> is a separate document — the page's CSS custom
       properties do not cross that boundary. The <style> block below is the
       only styling that reaches it, which is also what lets the mark follow the
       OS colour scheme.

    2. The keyhole is a real knockout, cut with a <mask> rather than painted on
       in the background colour, so the mark stays correct on any backdrop.
       A mask also lets the circle and the stem overlap freely, which an
       even-odd fill rule would render as a lens-shaped hole.

    3. textLength pins the wordmark to a fixed width. The font stack resolves
       differently on every platform, and without it the text would overflow the
       viewBox — which an <img> clips — on the wider fallbacks.

    The viewBox is trimmed to the artwork: `height` is set from
    kcTokenLogoHeight and the width follows the aspect ratio, so trailing empty
    space would shrink the visible mark.
  -->
  <style>
    .badge-from { stop-color: #6366f1; }
    .badge-to   { stop-color: #4338ca; }
    .word       { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 17px; font-weight: 650; }
    .word-name  { fill: #0f172a; }
    .word-suffix { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .badge-from { stop-color: #818cf8; }
      .badge-to   { stop-color: #6366f1; }
      .word-name  { fill: #e2e8f0; }
      .word-suffix { fill: #a5b4fc; }
    }
  </style>

  <defs>
    <linearGradient id="mb-badge" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop class="badge-from" offset="0"/>
      <stop class="badge-to" offset="1"/>
    </linearGradient>
    <!-- White keeps the pixel, black cuts it away. -->
    <mask id="mb-keyhole">
      <rect width="36" height="36" rx="10" fill="#ffffff"/>
      <circle cx="18" cy="14.6" r="4.5" fill="#000000"/>
      <path d="M15.6 17.2h4.8l1.05 7.9a1.7 1.7 0 0 1-1.68 1.9h-3.54a1.7 1.7 0 0 1-1.68-1.9Z" fill="#000000"/>
    </mask>
  </defs>

  <rect width="36" height="36" rx="10" fill="url(#mb-badge)" mask="url(#mb-keyhole)"/>

  <text class="word" x="48" y="23.4" textLength="106" lengthAdjust="spacingAndGlyphs"><tspan class="word-name">Modern</tspan><tspan class="word-suffix"> Auth</tspan></text>
</svg>
